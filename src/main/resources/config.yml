#=======================================================#
# Плагин от PlayeR_SkiLL для управления погодой         #
# в разных мирах на Сервере 1.12.2.                     #
#                                                       #
# Его возможности:                                      #
# - Отключение погоды в одних мирах, сохраняя цикл      #
#   погоды в других мирах.                              #
# - Настраиваемый цикл кастомной погоды для мира.       #
# - Объединение погоды на несколько миров.              #
#=======================================================#



#-------------------------------------------------------#
# Основное:                                             #
#-------------------------------------------------------#
# ► МИРЫ ВНЕ ВАЙТЛИСТА: погода всегда солнечная. Плагин #
# блокирует в них смену погоды даже через команды       #
#-------------------------------------------------------#
# ► МИРЫ В ВАЙТЛИСТЕ, НО БЕЗ НАСТРОЙКИ: обычный         #
# цикл погоды Майнкрафт.                                #
#-------------------------------------------------------#
# ► МИРЫ В ВАЙТЛИСТЕ С НАСТРОЙКАМИ: погода в них        #
# подчиняется настраиваемому циклу.                     #
#-------------------------------------------------------#


#-------------------------------------------------------#
# Миры, НЕ указанные в whitelist, будут всегда с ясной  #
# погодой.                                              #
#-------------------------------------------------------#
whitelist:
  - World
  - My_World
  - My_World2


#-------------------------------------------------------#
# Секция настроек погоды для каждого мира.              #
# Если вы хотите оставить в мире обычный цикл смены     #
# погоды, то не записывайте сюда его настройки.         #
# Можно создать группу миров с одинаковым циклом        #
# погоды:                                               #
# custom-weather:                                       #
#   "World,World1":                                     #
# Исключением будет только смена погоды командой.       #
#-------------------------------------------------------#
custom-weather:
  World:
    #Объявлять ли в боссбаре о наступлении ясной погоды?
    enable-bossbar-sun: true
    #Какой режим боссбара будет использован:
    #
    # countdown - боссбар будет опустошаться по мере
    # того, как проходит текущий тип погоды (Солнечно).
    # При нём настройки bossbar-<weather>-display-seconds
    # и bossbar-<weather>-fixed-progress не будут
    # задействованы.
    #
    # fixed - боссбар будет заполнен на указанный
    # процент.
    #
    bossbar-sun-mode: countdown
    #Тип боссбара. Допустимые значения: SOLID (целый), SEGMENTED_6, SEGMENTED_10,
    # SEGMENTED_12, SEGMENTED_20
    bossbar-sun-style: SOLID
    # Допустимые значения цвета: WHITE, YELLOW, BLUE, GREEN, PINK, PURPLE, RED
    bossbar-sun-color: YELLOW
    # Сколько будет длиться боссбар. Работает только при bossbar-<weather>-mode = fixed
    bossbar-sun-display-seconds: 30
    # Фиксированный процент здоровья в боссбаре. (Указывается в промежутке
    # от 0.0 до 1.0). Работает только при bossbar-<weather>-mode = fixed
    bossbar-sun-fixed-progress: 1
    # Надпись в боссбаре.
    bossbar-sun-text: "&6✷ &eСолнечно &6✷"
    #Сообщение в чате мира, в котором изменилась погода о том, что наступила
    # солнечная погода. Оставьте пустым "", чтобы ничего не показывать.
    # Можно сделать многострочным, как в этом примере:
    #chat-sun-text: |
    # &7Строка 1
    # &fСтрока 2
    chat-sun-text: "&b[&2Прогноз погоды&b] &eСолнце &fвышло из-за облаков и озарило наш &aчудесный мир &fсвоим светом!"
    # Длительность ясной погоды.
    # Выбирается случайное значение из интервала.
    sun-min-seconds: 1800      # 30 минут # Минимальная длительность ясной погоды.
    sun-max-seconds: 3000      # 50 минут # Максимальная длительность ясной погоды.
    # Когда завершается один тип погоды (Дождь/Гроза/Солнечно),
    # плагин выбирает следующую погоду. Два раза может выпадать
    # одна и та же погода, чтобы смена погоды имела большой
    # разброс и не была предсказуема. Суммарное количество шансов
    # разной погоды для одного мира не должно превышать 1 (100%)
    chance-sun: 0.626


    # Аналогично с двумя другими видами погоды.

    #🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁
    #🎁                                                           🎁
    #🎁  Желаю тебе быстро и грамотно провести настройку, чтобы   🎁
    #🎁  сделать миры более живыми, нежели базовое "Всегда день", 🎁
    #🎁  как происходит на большинстве серверов.                  🎁
    #🎁                                                           🎁
    #🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁=🎁

    #-----------------------------------------------------------#

    enable-bossbar-rain: true
    bossbar-rain-mode: fixed
    bossbar-rain-style: SEGMENTED_6
    bossbar-rain-color: BLUE
    bossbar-rain-display-seconds: 30
    bossbar-rain-fixed-progress: 0.05
    bossbar-rain-text: "&9☄ &bДождливо &9☄"
    chat-rain-text: "&b[&2Прогноз погоды&b] &fНачался проливной &bдождь&f!"
    rain-min-seconds: 480      # 8 минут
    rain-max-seconds: 900      # 15 минут
    chance-rain: 0.256

    #-----------------------------------------------------------#

    enable-bossbar-thunder: true
    bossbar-thunder-mode: countdown
    bossbar-thunder-style: SEGMENTED_6
    bossbar-thunder-color: PURPLE
    bossbar-thunder-display-seconds: 30
    bossbar-thunder-fixed-progress: 0.01
    bossbar-thunder-text: "&b⚡ &9Гроза &b⚡"
    chat-thunder-text: "&b[&2Прогноз погоды&b] &fНа сервере ожидается &9гроза&f! Объявлено штормовое предупреждение."
    thunder-min-seconds: 300   # 5 минут
    thunder-max-seconds: 1200  # 20 минут
    chance-thunder: 0.118

    #-----------------------------------------------------------#

    show-chat-message: true # Будет ли в чат мира писать об изменении погоды.


#-------------------------------------------------------#
# Блок перевода сообщений плагина.                      #
#-------------------------------------------------------#
messages:
  no-permission: "&6[&bWeather&3Age&6] &cВы не обладаете правами для выполнения этой команды!"
  reload-success: "&6[&bWeather&3Age&6] &2Конфигурация перезагружена!"
  forced-sun: "&6[&bWeather&3Age&6] &aПогода в мире &7%world% &aустановлена на &eCолнечно&a."
  forced-rain: "&6[&bWeather&3Age&6] &aПогода в мире &7%world% &aустановлена на &bДождь&a."
  forced-storm: "&6[&bWeather&3Age&6] &aПогода в мире &7%world% &aустановлена на &9Гроза&a."


#-------------------------------------------------------#
# Немного информации про погоду в ванильном Майнкрафт.  #
#-------------------------------------------------------#

#  В ванильной Minecraft погода меняется по строгому циклу:
#  ясно -> дождь -> ясно -> дождь. Шансов «начнётся ли дождь» нет —
#  дождь начинается ВСЕГДА после паузы. Случайной бывает только
#  ДЛИТЕЛЬНОСТЬ каждого периода:
#
#  Ясно (пауза между дождями): 10 - 150 минут (в среднем ~80 минут)
#  Дождь:                      10 - 20  минут (в среднем ~15 минут)
#  Гроза:                      3 - 13   минут (в среднем ~8 минут)
#
#  Пропорция ванили: ~84% солнца и ~16% непогоды.
