name: WeatherAge
version: 1.0.0
main: ru.player_skill.weatherage.WeatherAgePlugin
author: PlayeR_SkiLL, Alice AI
description: Плагин для гибкой настройки циклов погоды в разных мирах (включая кастомные циклы, боссбары и сообщения).
api-version: 1.13  # это нормально для 1.12.2: поле не ломает работу, но помогает серверам понимать совместимость

commands:
  weatherage:
    description: Управление погодой WeatherAge
    usage: /weatherage <reload|sun|rain|storm> [world]
    aliases:
      - wage

permissions:
  weatherage.admin:
    description: Доступ ко всем админ-командам плагина (включая reload)
    default: op
    children:
      weatherage.force: true
  weatherage.force:
    description: Принудительная смена погоды командой
    default: op
